[project]
name = "resurva"
version = "1.0.0"
description = "Food Waste Marketplace Modular Monolith Backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "B904", # exception chaining (raise from)
    "B008", # function call Depends in argument defaults
    "UP042", # subclass str, Enum (standard for serializable enums)
    "UP046", # Generic[T] subclassing
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # ignore unused imports in package initializers
"app/main.py" = ["F401"] # ignore unused imports used for SQLAlchemy registration

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
exclude = [
    ".venv",
    "**/__pycache__",
    "migrations",
]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalMemberAccess = false
reportImplicitRelativeImport = false
reportPrivateLocalImportUsage = false
reportUnusedCallResult = false
reportAny = false

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"


